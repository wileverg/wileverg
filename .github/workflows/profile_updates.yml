name: Profile Master Automation

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    name: Update Profile Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Update Blog Posts — skips gracefully if no Medium feed is configured
      - name: Pull Latest Blog Posts
        continue-on-error: true
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://medium.com/feed/@wileverg"
          max_post_count: 5

      # 2. Update WakaTime Stats
      # REQUIRED SECRET: WAKATIME_API_KEY (set in repo Settings → Secrets)
      - name: Update WakaTime Stats
        uses: athul/waka-readme@master
        if: env.WAKATIME_API_KEY != ''
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      # 3. Commit Changes
      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add .
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-update Profile Content"
          git push
